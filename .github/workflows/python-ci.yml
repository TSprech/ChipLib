# .github/workflows/python-ci.yml
#
# This workflow runs on every push and pull request to the main branch.
# It installs Python, your dependencies, and runs tests with coverage.

name: Python Test & Coverage

# 1. Triggers: Run this workflow on push/PR to the main branch
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

# 2. Jobs: Define what to run
jobs:
  build-and-test:
    # 3. Runner: Use the latest stable Ubuntu VM
    runs-on: ubuntu-latest

    # 4. Steps: The sequence of commands to execute
    steps:
      # 4.1. Checks out your repository's code
      - name: Check out repository
        uses: actions/checkout@v5

      # 4.2. Sets up a specific version of Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # 4.3. Installs your project's dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4.4. Runs tests with pytest and checks coverage
      # This is the most important step!
      - name: Run tests and check coverage
        run: |
          pip install pytest pytest-cov pytest-mock
          pytest \
            --cov=chiplib \
            --cov-report=term-missing \
            --cov-report=xml

      # 4.5. Upload coverage report to Coveralls
      - name: Upload coverage
        uses: coverallsapp/github-action@v2
        with:
          format: cobertura
          file: coverage.xml
          github-token: ${{ secrets.GITHUB_TOKEN }} # This token is provided by GitHub Actions automatically
